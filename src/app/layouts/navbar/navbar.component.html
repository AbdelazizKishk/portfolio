<nav
  class="fixed top-0 z-50 w-full border-b border-gray-200/80 bg-white/90 backdrop-blur-xl dark:border-gray-800/80 dark:bg-gray-950/90"
>
  <div
    class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6 md:px-8"
  >
    <!-- Logo -->
    <a
      href="#home"
      class="group flex items-center gap-1 text-xl font-extrabold tracking-tight text-gray-900 dark:text-white"
    >
      ABDELAZIZ
      <span
        class="text-red-600 transition-colors duration-300 group-hover:text-red-500 dark:text-red-500"
      >
        .M
      </span>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden items-center gap-8 md:flex">
      <ul
        class="flex items-center gap-7 text-sm font-medium text-gray-600 dark:text-gray-300"
      >
        <li>
          <a
            href="#home"
            class="group relative py-2 transition-colors duration-300 hover:text-red-600 dark:hover:text-red-400"
          >
            Home
            <span
              class="absolute bottom-0 left-0 h-0.5 w-0 bg-red-500 transition-all duration-300 group-hover:w-full"
            ></span>
          </a>
        </li>

        <li>
          <a
            href="#about"
            class="group relative py-2 transition-colors duration-300 hover:text-red-600 dark:hover:text-red-400"
          >
            About
            <span
              class="absolute bottom-0 left-0 h-0.5 w-0 bg-red-500 transition-all duration-300 group-hover:w-full"
            ></span>
          </a>
        </li>

        <li>
          <a
            href="#skills"
            class="group relative py-2 transition-colors duration-300 hover:text-red-600 dark:hover:text-red-400"
          >
            Skills
            <span
              class="absolute bottom-0 left-0 h-0.5 w-0 bg-red-500 transition-all duration-300 group-hover:w-full"
            ></span>
          </a>
        </li>

        <li>
          <a
            href="#projects"
            class="group relative py-2 transition-colors duration-300 hover:text-red-600 dark:hover:text-red-400"
          >
            Projects
            <span
              class="absolute bottom-0 left-0 h-0.5 w-0 bg-red-500 transition-all duration-300 group-hover:w-full"
            ></span>
          </a>
        </li>

        <li>
          <a
            href="#contact"
            class="group relative py-2 transition-colors duration-300 hover:text-red-600 dark:hover:text-red-400"
          >
            Contact
            <span
              class="absolute bottom-0 left-0 h-0.5 w-0 bg-red-500 transition-all duration-300 group-hover:w-full"
            ></span>
          </a>
        </li>
      </ul>

      <!-- Theme Toggle -->
      <button
        type="button"
        (click)="themeServiceService.toggle()"
        [attr.aria-label]="
          themeServiceService.isDark()
            ? 'Switch to light mode'
            : 'Switch to dark mode'
        "
        class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 bg-gray-50 text-gray-600 transition-all duration-300 hover:border-red-500 hover:bg-red-50 hover:text-red-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:hover:border-red-500 dark:hover:bg-red-500/10 dark:hover:text-red-400"
      >
        @if (themeServiceService.isDark()) {
          <i class="fa-solid fa-sun text-sm"></i>
        } @else {
          <i class="fa-solid fa-moon text-sm"></i>
        }
      </button>
    </div>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      (click)="isMenuOpen = !isMenuOpen"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
      class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-700 transition-all duration-300 hover:border-red-500 hover:text-red-600 dark:border-gray-700 dark:text-gray-300 dark:hover:border-red-500 dark:hover:text-red-400 md:hidden"
    >
      @if (isMenuOpen) {
        <i class="fa-solid fa-xmark text-lg"></i>
      } @else {
        <i class="fa-solid fa-bars text-lg"></i>
      }
    </button>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen) {
    <div
      class="border-t border-gray-200 bg-white px-6 py-5 shadow-lg dark:border-gray-800 dark:bg-gray-950 md:hidden"
    >
      <div class="flex flex-col gap-1">
        <a
          href="#home"
          (click)="closeMenuAfterNavigate()"
          class="rounded-lg px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-red-50 hover:text-red-600 dark:text-gray-300 dark:hover:bg-red-500/10 dark:hover:text-red-400"
        >
          Home
        </a>

        <a
          href="#about"
          (click)="closeMenuAfterNavigate()"
          class="rounded-lg px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-red-50 hover:text-red-600 dark:text-gray-300 dark:hover:bg-red-500/10 dark:hover:text-red-400"
        >
          About
        </a>

        <a
          href="#skills"
          (click)="closeMenuAfterNavigate()"
          class="rounded-lg px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-red-50 hover:text-red-600 dark:text-gray-300 dark:hover:bg-red-500/10 dark:hover:text-red-400"
        >
          Skills
        </a>

        <a
          href="#projects"
          (click)="closeMenuAfterNavigate()"
          class="rounded-lg px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-red-50 hover:text-red-600 dark:text-gray-300 dark:hover:bg-red-500/10 dark:hover:text-red-400"
        >
          Projects
        </a>

        <a
          href="#contact"
          (click)="closeMenuAfterNavigate()"
          class="rounded-lg px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-red-50 hover:text-red-600 dark:text-gray-300 dark:hover:bg-red-500/10 dark:hover:text-red-400"
        >
          Contact
        </a>

        <!-- Mobile Theme -->
        <div
          class="mt-3 flex items-center justify-between border-t border-gray-200 pt-4 dark:border-gray-800"
        >
          <span class="text-sm font-medium text-gray-500 dark:text-white">
            Theme
          </span>

          <button
            type="button"
            (click)="themeServiceService.toggle()"
            (click)="closeMenuAfterNavigate()"
            [attr.aria-label]="
              themeServiceService.isDark()
                ? 'Switch to light mode'
                : 'Switch to dark mode'
            "
            class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 bg-gray-50 text-gray-600 transition-all hover:border-red-500 hover:text-red-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:hover:border-red-500 dark:hover:text-red-400"
          >
            @if (themeServiceService.isDark()) {
              <i class="fa-solid fa-sun text-sm"></i>
            } @else {
              <i class="fa-solid fa-moon text-sm"></i>
            }
          </button>
        </div>
      </div>
    </div>
  }
</nav>

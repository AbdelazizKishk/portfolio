<article
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
>
  <!-- Image -->
  <div class="relative overflow-hidden">
    <img
      [src]="project().image"
      [alt]="project().name"
      class="h-48 w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />
  </div>

  <!-- Content -->
  <div class="flex flex-1 flex-col p-5">
    <!-- Title -->
    <h3 class="mb-2 text-xl font-bold text-gray-900 dark:text-white">
      {{ project().name }}
    </h3>

    <!-- Description -->
    <p
      class="mb-5 line-clamp-2 min-h-[40px] text-sm leading-5 text-gray-600 dark:text-gray-300"
      [title]="project().description"
    >
      {{ project().description }}
    </p>

    <!-- Buttons -->
    <div class="mt-auto flex gap-3">
      <a
        [href]="project().demo"
        target="_blank"
        rel="noopener noreferrer"
        class="flex-1 rounded-lg border border-red-500 px-4 py-2 text-center text-sm font-semibold text-red-600 dark:text-red-400 transition hover:bg-red-500 hover:text-white"
      >
        View Demo
      </a>

      <a
        [href]="project().repo"
        target="_blank"
        rel="noopener noreferrer"
        class="flex-1 rounded-lg border border-gray-400 dark:border-gray-600 px-4 py-2 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 transition hover:bg-gray-800 hover:text-white dark:hover:bg-gray-600"
      >
        View Repo
      </a>
    </div>
  </div>
</article>
